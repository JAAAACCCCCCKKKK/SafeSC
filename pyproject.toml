[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safesc"
version = "0.1.0"
description = "SafeSC — supply-chain trust auditing tools (index + scan) for CI pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",     # canonical Dependency model + typed graph state
    "pyyaml>=6",       # pnpm-lock.yaml parsing (Stage 1)
    "aiohttp>=3.9",    # async HTTP for Stage 2 hash verification
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]
# Tier-2 CI gate orchestration: deterministic spine + Stage-4 LLM specialists. No
# Redis/Postgres. This does NOT pull an LLM provider SDK — there is no default provider
# (BYOK, §3.5), so you MUST also install the extra for your chosen SAFESC_LLM_PROVIDER,
# e.g. `pip install "safesc[agent,anthropic]"` or `"safesc[agent,openai]"`.
agent = [
    "langgraph>=0.2",   # the state machine that schedules the graph (§2.6, §7)
]
# Reasoning-LLM providers (BYOK, §3.5). The provider SDK is lazily imported, so only the
# one matching your configured provider is needed. `openai` also covers every
# OpenAI-compatible endpoint (Azure / OpenRouter / Together / Groq / Ollama / vLLM …).
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.0"]
# §3 memory stores — lazily imported, so the core stays installable without these.
memory = [
    "redis>=5",                          # short-term store + distributed semaphores (§3.1)
    "psycopg[binary]>=3",                # PGVector long-term store connection (§3.2)
    "pgvector>=0.2",                     # vector column type / ops
    "langgraph-checkpoint-redis>=0.0.1", # LangGraph Redis checkpointer (§3.1)
]

[project.scripts]
index = "tools.index.cli.main:main"
scan = "tools.scan.cli.main:main"
# Tier-2 CI entrypoint: wires the real tools + a store-free local session, then delegates
# to the injectable entrypoints.cli.main (no Redis/Postgres; BYOK LLM key from env).
safesc = "entrypoints.bootstrap:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["tools", "graph", "entrypoints", "reporter", "memory", "security"]

[tool.coverage.report]
# Enforce the repository ruleset's 80% minimum test-coverage gate in CI.
fail_under = 80
show_missing = true
skip_empty = true

[tool.hatch.build.targets.wheel]
# Ship the full runtime, not just the frozen Stage 0–3 tools, so the `safesc`
# console script and its imports (graph, entrypoints, reporter, memory, security) resolve
# after a plain `pip install`. Credential handling lives in the `security` package.
packages = ["tools", "graph", "entrypoints", "reporter", "memory", "security"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safesc"
version = "0.1.0"
description = "SafeSC — supply-chain trust auditing tools (index + scan) for CI pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",     # canonical Dependency model + typed graph state
    "pyyaml>=6",       # pnpm-lock.yaml parsing (Stage 1)
    "aiohttp>=3.9",    # async HTTP for Stage 2 hash verification
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
index = "tools.index.cli.main:main"
scan = "tools.scan.cli.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
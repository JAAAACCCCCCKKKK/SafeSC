[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safesc"
version = "1.2.1"
description = "Supply-chain trust auditing for CI — deterministic signals with escalate-only LLM analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "JAAAACCCCCCKKKK", email = "uk7501459988@gmail.com" }]
keywords = ["supply-chain", "security", "sca", "dependency", "audit", "ci", "sbom", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",     # canonical Dependency model + typed graph state
    "pyyaml>=6",       # pnpm-lock.yaml parsing (Stage 1)
    "aiohttp>=3.9",    # async HTTP for Stage 2 hash verification
    "packaging>=21",   # PEP 440 version normalisation (Stage 3 provenance version match)
    "pathspec>=0.12",  # gitignore-style .safescignore / --exclude matching (Stage 0)
]

[project.optional-dependencies]
# Tier-2 CI gate orchestration: deterministic spine + Stage-4 LLM specialists. No
# Redis/Postgres. This does NOT pull an LLM provider SDK — there is no default provider
# (BYOK, §3.5), so you MUST also install the extra for your chosen SAFESC_LLM_PROVIDER,
# e.g. `pip install "safesc[agent,anthropic]"` or `"safesc[agent,openai]"`.
agent = [
    "langgraph>=1.2,<2",   # the state machine that schedules the graph (§2.6, §7); the
                           # 1.x API is what SafeSC is built and tested against — the 0.x
                           # API differs substantially and would fail at import.
]
# Reasoning-LLM providers (BYOK, §3.5). The provider SDK is lazily imported, so only the
# one matching your configured provider is needed. `openai` also covers every
# OpenAI-compatible endpoint (Azure / OpenRouter / Together / Groq / Ollama / vLLM …).
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.0"]
# §3 memory stores — lazily imported, so the core stays installable without these.
memory = [
    "redis>=7.4,<8",                     # short-term store + distributed semaphores (§3.1)
    "psycopg[binary]>=3.3,<4",           # PGVector long-term store connection (§3.2)
    "voyageai>=0.5,<0.6",                # default BYOK embedding provider (§3.2, §3.5)
    "langgraph-checkpoint-redis>=0.5,<0.6", # LangGraph Redis checkpointer (§3.1)
]

# Development-only tooling (PEP 735). Not a published extra — it never appears in the
# wheel's `Provides-Extra` metadata, so users can't `pip install safesc[dev]`. Installed
# for contributors via `uv sync --group dev` (or `pip install --group dev` on pip >=25.1).
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[project.scripts]
index = "safesc.tools.index.cli.main:main"
scan = "safesc.tools.scan.cli.main:main"
# Tier-2 CI entrypoint: wires the real tools + a store-free local session, then delegates
# to the injectable safesc.entrypoints.cli.main (no Redis/Postgres; BYOK LLM key from env).
safesc = "safesc.entrypoints.bootstrap:main"

[project.urls]
Homepage = "https://github.com/JAAAACCCCCCKKKK/SafeSC"
Repository = "https://github.com/JAAAACCCCCCKKKK/SafeSC"
Issues = "https://github.com/JAAAACCCCCCKKKK/SafeSC/issues"
Changelog = "https://github.com/JAAAACCCCCCKKKK/SafeSC/releases"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["safesc"]

[tool.coverage.report]
# Enforce the repository ruleset's 80% minimum test-coverage gate in CI.
fail_under = 80
show_missing = true
skip_empty = true

[tool.hatch.build.targets.sdist]
exclude = [
    "/tests",
    "/.github",
    "/docs",
    "/dist",
    "/.claude",            # local editor/agent settings — contains absolute local paths
    "/.safescignore",      # this repo's own self-audit config, not runtime config
    "/.gitguardian.yml",   # CI-only secret-scanning config
    "/RELEASE_NOTES_*.md", # per-release artifact for the GitHub Release, not the package
]

[tool.hatch.build.targets.wheel]
# Ship the whole runtime under one top-level `safesc` package, so its internal subpackages
# (safesc.tools / .graph / .entrypoints / .reporter / .memory / .security) never occupy
# generic global import names once installed.
packages = ["safesc"]
# Ship the PEP 561 `py.typed` markers so the `Typing :: Typed` classifier is honest and
# downstream type-checkers pick up SafeSC's inline annotations.
artifacts = ["**/py.typed"]
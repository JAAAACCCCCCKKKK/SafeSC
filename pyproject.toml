[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safesc"
version = "2.0.0"
description = "Agentic supply-chain trust auditing on Strands — deterministic signals, LLM subagents, one deterministic score"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "JAAAACCCCCCKKKK", email = "uk7501459988@gmail.com" }]
keywords = ["supply-chain", "security", "sca", "dependency", "audit", "ci", "sbom", "llm", "agents", "strands"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",     # canonical Dependency model + typed tool I/O
    "pyyaml>=6",       # pnpm-lock.yaml parsing (Stage 1) + the known-attack corpus
    "aiohttp>=3.9",    # async HTTP for Stage 2-3 registry and OSV calls
    "httpx>=0.27",     # artifact downloads, LLM endpoint reachability checks
    "packaging>=21",   # PEP 440 version normalisation (Stage 3 provenance version match)
    "pathspec>=0.12",  # gitignore-style .safescignore / --exclude matching (Stage 0)
    # The agent runtime, every model provider Strands ships that authenticates with an API
    # key (LLM_PROVIDER picks one at run time; unused SDKs are never imported), and the
    # vended web_fetch tool. One install for every use: `pip install safesc`.
    "strands-agents[anthropic,openai,gemini,litellm,llamaapi,mistral,ollama,writer,web-fetch]>=1.62,<2",
]

# Development-only tooling (PEP 735). Not a published extra — it never appears in the
# wheel's `Provides-Extra` metadata, so users can't `pip install safesc[dev]`. Installed
# for contributors via `uv sync --group dev` (or `pip install --group dev` on pip >=25.1).
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[project.scripts]
# One command. Static stages have no entrypoint of their own: only agents invoke them.
safesc = "safesc.cli:main"

[project.urls]
Homepage = "https://github.com/JAAAACCCCCCKKKK/SafeSC"
Repository = "https://github.com/JAAAACCCCCCKKKK/SafeSC"
Issues = "https://github.com/JAAAACCCCCCKKKK/SafeSC/issues"
Changelog = "https://github.com/JAAAACCCCCCKKKK/SafeSC/releases"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["safesc"]

[tool.coverage.report]
# Enforce the repository ruleset's 80% minimum test-coverage gate in CI.
fail_under = 80
show_missing = true
skip_empty = true

[tool.hatch.build.targets.sdist]
exclude = [
    "/tests",
    "/.github",
    "/docs",
    "/dist",
    "/.claude",            # local editor/agent settings — contains absolute local paths
    "/.safescignore",      # this repo's own self-audit config, not runtime config
    "/.gitguardian.yml",   # CI-only secret-scanning config
    "/RELEASE_NOTES_*.md", # per-release artifact for the GitHub Release, not the package
]

[tool.hatch.build.targets.wheel]
# Ship the whole runtime under one top-level `safesc` package, so its internal subpackages
# (safesc.tools / .graph / .entrypoints / .reporter / .memory / .security) never occupy
# generic global import names once installed.
packages = ["safesc"]
# Ship the PEP 561 `py.typed` markers so the `Typing :: Typed` classifier is honest and
# downstream type-checkers pick up SafeSC's inline annotations.
artifacts = ["**/py.typed"]

# The known-attack fingerprint corpus (CLAUDE.md §3.2) lives at the repo root so it is
# reviewable in git alongside the code, but it has to reach an installed copy too —
# otherwise an installed `safesc` would run without its corpus. Installed under
# `safesc/memory/corpus/` (not `safesc/fingerprints/`) so the data directory can never be
# mistaken for an importable package next to `safesc.memory.fingerprints`.
[tool.hatch.build.targets.wheel.force-include]
"fingerprints" = "safesc/memory/corpus"
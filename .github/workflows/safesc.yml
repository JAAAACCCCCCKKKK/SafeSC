# Example CI gate using the SafeSC action — and this repository's own self-audit.
#
# Copy this into a consumer repo, change `uses: ./` to a pinned ref such as
# `JAAAACCCCCCKKKK/SafeSC@v2`, and add a repository secret SAFESC_LLM_API_KEY (your key for
# the provider below). Provider and model come from repository variables so they can be
# changed without editing the workflow.
#
# Memory needs no setup: the action keeps it in a directory carried between runs by the
# runner cache. In this repo the audit self-guards on the secret, so CI never fails when no
# key is configured.

name: SafeSC

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # required to upload the SARIF report

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check an LLM key is configured
        id: guard
        shell: bash
        env:
          LLM_KEY: ${{ secrets.SAFESC_LLM_API_KEY }}
        run: |
          if [ -n "$LLM_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SAFESC_LLM_API_KEY secret not set; skipping the audit gate."
          fi

      - name: Dependency audit gate
        if: steps.guard.outputs.ready == 'true'
        uses: ./ # in a consumer repo: JAAAACCCCCCKKKK/SafeSC@v2
        with:
          llm-provider: ${{ vars.SAFESC_LLM_PROVIDER || 'anthropic' }}
          llm-model: ${{ vars.SAFESC_LLM_MODEL || 'claude-sonnet-5' }}
          llm-api-key: ${{ secrets.SAFESC_LLM_API_KEY }}
          # Optional complementary analyses: authorship, vuln-hunt, transitive, github, all.
          # with: authorship,vuln-hunt

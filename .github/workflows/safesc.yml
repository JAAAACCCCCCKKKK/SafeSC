# Example CI gate using the SafeSC action.
#
# Copy this into a *consumer* repo and change the `uses:` line to a pinned ref, e.g.:
#     uses: JAAAACCCCCCKKKK/SafeSC@v1
# Then add a repository secret named SAFESC_LLM_API_KEY (your BYOK LLM key).
#
# In this repo it is manual-only (workflow_dispatch) and self-guards on the secret, so it
# never fails CI when no key is configured. Uncomment the pull_request/push triggers in a
# consumer repo to gate merges.

name: SafeSC

on:
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches: [main]

permissions:
  contents: read
  security-events: write # required to upload the SARIF report

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check BYOK key is configured
        id: guard
        shell: bash
        run: |
          if [ -n "${{ secrets.SAFESC_LLM_API_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SAFESC_LLM_API_KEY secret not set; skipping the audit gate."
          fi

      # One step: the action installs SafeSC, runs the gate, uploads SARIF to code
      # scanning, and archives the report artifacts. Consumers only add the job-level
      # `permissions` above and the SAFESC_LLM_API_KEY secret.
      - name: Dependency audit gate
        if: steps.guard.outputs.ready == 'true'
        id: safesc
        uses: ./ # in a consumer repo: JAAAACCCCCCKKKK/SafeSC@v1
        with:
          target: "."
          llm-api-key: ${{ secrets.SAFESC_LLM_API_KEY }}
          llm-provider: anthropic          # required: anthropic | openai (no default)
          # Optional: pin a model / endpoint.
          # llm-model: gpt-4o
          # llm-base-url: https://your-openai-compatible-endpoint/v1

name: Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The one-command install and the start-up contract: `safesc` must refuse to run, with
  # exit code 2 and an actionable message, at each step of LLM validation — before any
  # agent, network call to a registry, or report. A real end-to-end audit needs a real
  # LLM key and lives in safesc.yml; the offline end-to-end runs (real orchestrator,
  # scripted model) are tests/test_attack_fixtures.py and tests/test_agents.py.
  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (single install, no extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Help and version
        run: |
          safesc --help
          safesc --version

      - name: Start-up validation refuses misconfiguration in order
        shell: bash
        run: |
          set +e
          expect() {  # expect <grep pattern> -- <env assignments...>
            pattern="$1"; shift
            out="$(env -u LLM_PROVIDER -u LLM_MODEL -u LLM_API_KEY "$@" safesc 2>&1)"; code=$?
            echo "$out"
            if [ "$code" != "2" ] || ! printf '%s' "$out" | grep -q "$pattern"; then
              echo "::error::expected exit 2 matching '$pattern', got exit $code"; exit 1
            fi
          }
          expect "missing required environment variable"
          expect "not a supported provider" LLM_PROVIDER=skynet LLM_MODEL=x LLM_API_KEY=k
          expect "does not match provider" LLM_PROVIDER=openai LLM_MODEL=claude-sonnet-5 LLM_API_KEY=k
          expect "cannot reach" LLM_PROVIDER=ollama LLM_MODEL=qwen3:8b LLM_API_KEY=k LLM_BASE_URL=http://127.0.0.1:9
          expect "rejected LLM_API_KEY" LLM_PROVIDER=anthropic LLM_MODEL=claude-sonnet-5 LLM_API_KEY=sk-ant-invalid

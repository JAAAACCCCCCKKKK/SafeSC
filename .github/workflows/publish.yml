name: Publish to PyPI

# Trusted Publishing (OIDC) to PyPI. No API token is stored: PyPI verifies this
# repository + workflow filename (`publish.yml`) and mints a short-lived token at
# publish time. Configure the pending/active publisher on PyPI with:
#   owner=JAAAACCCCCCKKKK  repo=SafeSC  workflow=publish.yml  environment=pypi
#
# Release-triggered only. There is deliberately no `workflow_dispatch`: a manual run
# from an arbitrary branch could publish an unintended version, and PyPI never allows a
# version to be overwritten or reused. Publishing is reachable only via a published
# GitHub Release.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Verify wheel installs and entrypoints resolve
        # twine check only validates metadata. Install the bare wheel (no extras) in a
        # clean venv so a missing core module, package-data file, or console-script
        # target fails the release here rather than on a user's first `pip install`.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/safesc --help
          /tmp/verify/bin/index --help
          /tmp/verify/bin/scan --help

      - name: Verify py.typed is packaged
        # Honour the `Typing :: Typed` classifier: the PEP 561 marker must ship in the
        # wheel or downstream type-checkers silently ignore SafeSC's inline annotations.
        run: python -c "import zipfile,glob,sys; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if any(x.endswith('py.typed') for x in n) else 'py.typed missing from wheel')"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/safesc/
    permissions:
      # Mandatory for Trusted Publishing (OIDC): lets the action request the
      # short-lived identity token PyPI exchanges for an upload token.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging-and-sanity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev build

      - name: Dependency sanity check
        run: python -m pip check

      - name: Compile project sources
        run: python -m compileall safesc

      - name: CLI refuses to start without an LLM (exit 2, no traceback)
        shell: bash
        run: |
          set +e
          safesc > out.txt 2>&1
          code=$?
          cat out.txt
          test "$code" = "2" && grep -q "LLM_PROVIDER, LLM_MODEL, LLM_API_KEY" out.txt

      - name: Build sdist and wheel
        run: python -m build

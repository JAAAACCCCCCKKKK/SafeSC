name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging-and-sanity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Dependency sanity check
        run: python -m pip check

      - name: Compile project sources
        run: python -m compileall depaudit

      - name: Discover lockfiles in repository
        run: python -m depaudit.core.discovery .

      - name: Build sdist and wheel
        run: python -m build

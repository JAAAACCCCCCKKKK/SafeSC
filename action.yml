name: "SafeSC dependency audit"
description: >-
  Agentic dependency supply-chain audit: deterministic Stage 0-3 signals run by an
  orchestrator agent, LLM subagents for identity / behavior / provenance / authorship /
  unreported-vulnerability analysis, and one deterministic score that gates CI.
  Bring your own LLM key (any provider Strands supports).
author: "SafeSC"
branding:
  icon: "shield"
  color: "purple"

inputs:
  llm-provider:
    description: >-
      LLM provider: anthropic, openai, openai_responses, bedrock, gemini, mistral,
      llamaapi, ollama, llamacpp or writer.
    required: true
  llm-model:
    description: "Model id served by that provider, e.g. claude-sonnet-5, gpt-5, gemini-2.5-pro."
    required: true
  llm-api-key:
    description: "Your API key for that provider. Pass a repository secret."
    required: true
  llm-base-url:
    description: "Optional proxy / gateway / OpenAI-compatible endpoint."
    required: false
    default: ""
  llm-context-window:
    description: "Optional context window of the model, in tokens (tunes automatic context compression)."
    required: false
    default: ""
  target:
    description: "Path, lockfile or package spec to inspect. Blank = the checked-out repository."
    required: false
    default: ""
  with:
    description: >-
      Complementary analyses, comma-separated: authorship (code-style authorship analysis of
      every direct dependency), vuln-hunt (unreported-vulnerability hunting + independent
      verification), transitive (extend both to transitive deps), github (GitHub MCP tools
      for subagents; uses github-token), all.
    required: false
    default: ""
  exclude:
    description: >-
      Gitignore-syntax patterns to exclude from discovery, one per line. Layers on top of
      any `.safescignore` committed at the target root.
    required: false
    default: ""
  fail-on:
    description: "Fail the gate at this severity: LOW | MEDIUM | HIGH | CRITICAL."
    required: false
    default: "HIGH"
  strict:
    description: "Treat an incomplete analysis as a gate failure."
    required: false
    default: "false"
  max-subagents:
    description: "Subagent invocations allowed per run (cost ceiling)."
    required: false
    default: "40"
  github-token:
    description: >-
      Token for SafeSC's GitHub calls (popularity signals; the GitHub MCP server with
      `with: github`). The job token is enough; anonymous access is 60 requests/hour per IP.
    required: false
    default: ${{ github.token }}
  report-dir:
    description: "Directory to write JSON / Markdown / SARIF reports."
    required: false
    default: "safesc-reports"
  format:
    description: "Report format to write: all | json | markdown | sarif."
    required: false
    default: "all"
  python-version:
    description: "Python version used to run SafeSC."
    required: false
    default: "3.12"
  upload-sarif:
    description: >-
      Upload the SARIF report to GitHub code scanning (needs `permissions: security-events:
      write`). Set to "false" to skip.
    required: false
    default: "true"
  upload-artifact:
    description: "Archive the report-dir as a build artifact. Set to \"false\" to skip."
    required: false
    default: "true"
  artifact-name:
    description: "Name for the archived report artifact."
    required: false
    default: "safesc-reports"

outputs:
  exit-code:
    description: "SafeSC exit code (0 = pass, 1 = gate failed, 2 = configuration error or no verdict)."
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    # Preflight the two things that make a later SARIF upload fail, and warn NOW (before the
    # slow install + audit) instead of only after the upload. A read probe of the
    # code-scanning API with the job token distinguishes both causes by its 403 message.
    # This never fails the run — it only emits ::warning:: annotations.
    - name: Preflight SARIF / code scanning readiness
      if: >-
        inputs.upload-sarif == 'true'
        && (inputs.format == 'all' || inputs.format == 'sarif')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/code-scanning/analyses?per_page=1"
        code=$(curl -sS -o /tmp/safesc_cs.json -w '%{http_code}' \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "$url")
        body="$(cat /tmp/safesc_cs.json 2>/dev/null)"
        case "$code" in
          200|404)
            echo "SafeSC preflight: code scanning reachable (HTTP $code); the SARIF upload should succeed."
            ;;
          403)
            if printf '%s' "$body" | grep -qi "advanced security"; then
              echo "::warning title=SafeSC: code scanning not available::The SARIF report will not reach GitHub code scanning. This repository does not have code scanning enabled (private repositories require GitHub Advanced Security). The audit still runs and its report is archived as an artifact. Set upload-sarif: false to silence this."
            else
              echo "::warning title=SafeSC: missing security-events permission::The SARIF report will not reach GitHub code scanning. The workflow's GITHUB_TOKEN lacks 'security-events: write' — add it to the job (or workflow) 'permissions:' block. The audit still runs and its report is archived as an artifact."
            fi
            ;;
          000)
            echo "::notice title=SafeSC::Could not reach the code scanning API for a preflight check; will attempt the SARIF upload anyway."
            ;;
          *)
            echo "::warning title=SafeSC: code scanning preflight inconclusive::Unexpected HTTP $code from the code scanning API. The SARIF upload may fail; if it does it is non-fatal and the report is still archived."
            ;;
        esac

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # One install for every use: the agent runtime and every supported provider SDK.
    - name: Install SafeSC
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "${GITHUB_ACTION_PATH}"

    # Memory is required. It is a plain directory, so the runner cache carries prior
    # verdicts from run to run: each run restores the newest snapshot and saves its own.
    - name: Restore SafeSC memory
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/safesc-memory
        key: safesc-memory-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          safesc-memory-${{ runner.os }}-

    - name: Run safesc
      id: run
      shell: bash
      env:
        # BYOK: the key stays in the environment and never enters the ledger, memory,
        # logs or reports. Values reach the script only through env, never `${{ }}`
        # interpolation into the run body.
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        LLM_MODEL: ${{ inputs.llm-model }}
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        LLM_BASE_URL: ${{ inputs.llm-base-url }}
        LLM_CONTEXT_WINDOW: ${{ inputs.llm-context-window }}
        SAFESC_MEMORY_DIR: ${{ runner.temp }}/safesc-memory
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TARGET: ${{ inputs.target }}
        WITH: ${{ inputs.with }}
        EXCLUDE_PATTERNS: ${{ inputs.exclude }}
        FAIL_ON: ${{ inputs.fail-on }}
        STRICT: ${{ inputs.strict }}
        MAX_SUBAGENTS: ${{ inputs.max-subagents }}
        REPORT_DIR: ${{ inputs.report-dir }}
        REPORT_FORMAT: ${{ inputs.format }}
      run: |
        set +e
        args=(--report-dir "$REPORT_DIR" --format "$REPORT_FORMAT" --fail-on "$FAIL_ON" --max-subagents "$MAX_SUBAGENTS")
        if [ -n "$TARGET" ]; then args=("$TARGET" "${args[@]}"); fi
        if [ -n "$WITH" ]; then args+=(--with "$WITH"); fi
        if [ "$STRICT" = "true" ]; then args+=(--strict); fi
        while IFS= read -r pattern; do
          if [ -n "$pattern" ]; then args+=(--exclude "$pattern"); fi
        done <<< "$EXCLUDE_PATTERNS"
        safesc "${args[@]}"
        code=$?
        # Defer the gate's exit code so the publishing steps below still run; the last
        # step re-applies it.
        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"
        if [ -f "$REPORT_DIR/safesc-report.sarif" ]; then
          echo "sarif-produced=true" >> "$GITHUB_OUTPUT"
        else
          echo "sarif-produced=false" >> "$GITHUB_OUTPUT"
        fi
        exit 0

    # continue-on-error: code scanning needs `security-events: write` and a repository
    # where it is available. Its absence must not fail an audit whose verdict is already
    # in the exit code and whose reports are archived below.
    - name: Upload SARIF to code scanning
      id: sarif
      if: always() && inputs.upload-sarif == 'true' && steps.run.outputs.sarif-produced == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.report-dir }}/safesc-report.sarif

    - name: Explain a skipped SARIF upload
      if: always() && inputs.upload-sarif == 'true' && steps.run.outputs.sarif-produced == 'true' && steps.sarif.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=SafeSC SARIF upload skipped::Could not upload the SARIF report to code scanning. The audit result (exit code) and the archived report are unaffected. Usual causes: missing 'permissions: security-events: write', or a private repository without code scanning."

    - name: Archive report artifacts
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.report-dir }}/

    - name: Re-apply the gate exit code
      if: always()
      shell: bash
      run: exit ${{ steps.run.outputs.exit-code }}

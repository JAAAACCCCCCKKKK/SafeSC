name: "SafeSC dependency audit"
description: >-
  SafeSC dependency-audit CI gate: deterministic supply-chain signals (Stages 0–3) plus
  LLM deep analysis (Stage 4). Bring-your-own LLM key; no Redis or Postgres required,
  but both can be attached for caching, fleet-wide rate limiting and prior-finding grounding.
author: "SafeSC"
branding:
  icon: "shield"
  color: "purple"

inputs:
  target:
    description: "Repo path, lockfile, or git URL to audit."
    required: false
    default: "."
  llm-api-key:
    description: "BYOK reasoning-LLM API key for your chosen provider. Pass a repository secret."
    required: true
  llm-provider:
    description: "LLM provider (required, no default): anthropic or openai (also any OpenAI-compatible endpoint via llm-base-url)."
    required: true
  llm-model:
    description: "Override the LLM model id (blank = provider default)."
    required: false
    default: ""
  llm-base-url:
    description: "Override the LLM base URL (proxy / gateway / Bedrock / Azure / OpenAI-compatible endpoint)."
    required: false
    default: ""
  exclude:
    description: >-
      Gitignore-syntax patterns to exclude from discovery, one per line. Layers on top
      of any `.safescignore` file committed at the target root (which is auto-discovered
      with no input needed) — use this input for one-off/CI-level excludes instead.
      Useful for excluding paths that deliberately look like real dependency files
      (e.g. test fixtures for a supply-chain-security tool auditing its own repo).
    required: false
    default: ""
  # --- optional memory layer (CLAUDE.md §3.6) ----------------------------------------
  # All blank by default = the store-free tier, which is what GitHub-hosted runners want.
  # These matter when SafeSC can reach a store that OUTLIVES the job: a managed Redis /
  # Postgres, or a self-hosted runner beside your own instances. A `services:` container
  # is NOT useful here — it is recreated per job, so the cache starts empty, checkpoints
  # are unreachable and rate limiting is scoped to a single run.
  redis-url:
    description: >-
      Redis URL. Enables checkpointing (for `resume`), fleet-wide per-registry rate
      limiting, the 7-day cross-run cheap-signal cache, and exact-hash recall of prior
      verdicts. Needs no second API key. Pass a repository secret.
    required: false
    default: ""
  pgvector-dsn:
    description: >-
      Postgres/pgvector DSN. Adds similarity search over prior findings and the
      known-attack fingerprint corpus. Requires embedding-api-key. Pass a secret.
    required: false
    default: ""
  embedding-api-key:
    description: "BYOK embedding-provider key. Required whenever pgvector-dsn is set. Pass a secret."
    required: false
    default: ""
  embedding-model:
    description: "Embedding model id (blank = voyage-3-large). Must match embedding-dim."
    required: false
    default: ""
  embedding-base-url:
    description: "Embedding provider base URL (blank = Voyage; set for an OpenAI-compatible endpoint)."
    required: false
    default: ""
  embedding-dim:
    description: >-
      pgvector column width. MUST match the embedding model — changing it means a
      re-index, not a hot swap. Blank = 1024 (voyage-3-large).
    required: false
    default: ""
  memory-strict:
    description: >-
      Fail the run when a configured store is unreachable, instead of warning and
      auditing store-free. Off by default because memory can only escalate a verdict,
      never lower one, so its absence is always safe.
    required: false
    default: "false"
  store-init:
    description: >-
      Run `safesc store init` before auditing to create the pgvector schema. Off by
      default: it needs DDL privileges, and the schema only has to be created once.
    required: false
    default: "false"

  report-dir:
    description: "Directory to write JSON / Markdown / SARIF report artifacts."
    required: false
    default: "safesc-reports"
  format:
    description: "Report format to write: all | json | markdown | sarif."
    required: false
    default: "all"
  python-version:
    description: "Python version used to run SafeSC."
    required: false
    default: "3.12"
  upload-sarif:
    description: >-
      Upload the SARIF report to GitHub code scanning (needs the caller job to grant
      `permissions: security-events: write`). Set to "false" to skip.
    required: false
    default: "true"
  upload-artifact:
    description: "Archive the report-dir as a build artifact. Set to \"false\" to skip."
    required: false
    default: "true"
  artifact-name:
    description: "Name for the archived report artifact."
    required: false
    default: "safesc-reports"

outputs:
  exit-code:
    description: "SafeSC exit code (0 = gate pass, 1 = gate fail on critical finding)."
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    # Preflight the two things that make a later SARIF upload fail, and warn NOW (before the
    # slow install + audit) instead of only after the upload. A read probe of the
    # code-scanning API with the job token distinguishes both causes by its 403 message:
    #   * "Resource not accessible by integration" → missing security-events: write
    #   * "Advanced Security must be enabled …"     → code scanning not available (private, no GHAS)
    # This never fails the run — it only emits ::warning:: annotations.
    - name: Preflight SARIF / code scanning readiness
      if: >-
        inputs.upload-sarif == 'true'
        && (inputs.format == 'all' || inputs.format == 'sarif')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/code-scanning/analyses?per_page=1"
        code=$(curl -sS -o /tmp/safesc_cs.json -w '%{http_code}' \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "$url")
        body="$(cat /tmp/safesc_cs.json 2>/dev/null)"
        case "$code" in
          200|404)
            echo "SafeSC preflight: code scanning reachable (HTTP $code); the SARIF upload should succeed."
            ;;
          403)
            if printf '%s' "$body" | grep -qi "advanced security"; then
              echo "::warning title=SafeSC: code scanning not available::The SARIF report will not reach GitHub code scanning. This repository does not have code scanning enabled (private repositories require GitHub Advanced Security). The audit still runs and its report is archived as an artifact. Set upload-sarif: false to silence this."
            else
              echo "::warning title=SafeSC: missing security-events permission::The SARIF report will not reach GitHub code scanning. The workflow's GITHUB_TOKEN lacks 'security-events: write' — add it to the job (or workflow) 'permissions:' block. The audit still runs and its report is archived as an artifact."
            fi
            ;;
          000)
            echo "::notice title=SafeSC::Could not reach the code scanning API for a preflight check; will attempt the SARIF upload anyway."
            ;;
          *)
            echo "::warning title=SafeSC: code scanning preflight inconclusive::Unexpected HTTP $code from the code scanning API. The SARIF upload may fail; if it does it is non-fatal and the report is still archived."
            ;;
        esac

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # Tier-2 by default (CLAUDE.md §3.6) — no Redis, no Postgres, no checkpointer, which
    # is what a GitHub-hosted runner wants. The `memory` extra (redis / psycopg / voyageai /
    # langgraph-checkpoint-redis) is pulled ONLY when a store is actually configured, so
    # consumers who do not use one never pay for its install.
    - name: Install SafeSC
      shell: bash
      env:
        REDIS_URL: ${{ inputs.redis-url }}
        PGVECTOR_DSN: ${{ inputs.pgvector-dsn }}
      run: |
        python -m pip install --upgrade pip
        # The orchestration 'agent' extra plus both built-in provider SDKs (the consumer
        # picks one via llm-provider; there is no default provider, BYOK — §3.5). Unused
        # SDKs are never imported.
        extras="agent,anthropic,openai"
        if [ -n "$REDIS_URL" ] || [ -n "$PGVECTOR_DSN" ]; then
          extras="${extras},memory"
          echo "SafeSC: tier-3 runtime (memory extra installed)."
        fi
        python -m pip install "${GITHUB_ACTION_PATH}[${extras}]"

    # Opt-in, and skipped entirely without a DSN. Idempotent (CREATE ... IF NOT EXISTS),
    # but it needs DDL privileges, so an audit must never do it implicitly.
    - name: Initialise pgvector schema
      if: inputs.store-init == 'true' && inputs.pgvector-dsn != ''
      shell: bash
      env:
        SAFESC_PGVECTOR_DSN: ${{ inputs.pgvector-dsn }}
        SAFESC_EMBEDDING_API_KEY: ${{ inputs.embedding-api-key }}
        SAFESC_EMBEDDING_DIM: ${{ inputs.embedding-dim }}
      run: safesc store init

    - name: Run safesc audit
      id: run
      shell: bash
      env:
        # BYOK: the key stays in the caller's environment and never enters state/logs (§3.5).
        SAFESC_LLM_API_KEY: ${{ inputs.llm-api-key }}
        SAFESC_LLM_PROVIDER: ${{ inputs.llm-provider }}
        SAFESC_LLM_MODEL: ${{ inputs.llm-model }}
        SAFESC_LLM_BASE_URL: ${{ inputs.llm-base-url }}
        # Memory layer (§3.6). Blank values are ignored by select_runtime, so leaving these
        # unset is exactly the tier-2 path. A configured-but-unreachable store degrades with
        # a warning unless memory-strict is on.
        SAFESC_REDIS_URL: ${{ inputs.redis-url }}
        SAFESC_PGVECTOR_DSN: ${{ inputs.pgvector-dsn }}
        SAFESC_EMBEDDING_API_KEY: ${{ inputs.embedding-api-key }}
        SAFESC_EMBEDDING_MODEL: ${{ inputs.embedding-model }}
        SAFESC_EMBEDDING_BASE_URL: ${{ inputs.embedding-base-url }}
        SAFESC_EMBEDDING_DIM: ${{ inputs.embedding-dim }}
        SAFESC_MEMORY_STRICT: ${{ inputs.memory-strict }}
        # Values reach the script through the environment, never by `${{ }}` interpolation
        # into the `run:` body — a DSN, key or pattern containing shell metacharacters would
        # otherwise be executed rather than passed.
        EXCLUDE_PATTERNS: ${{ inputs.exclude }}
        TARGET: ${{ inputs.target }}
        REPORT_DIR: ${{ inputs.report-dir }}
        REPORT_FORMAT: ${{ inputs.format }}
      run: |
        set +e
        # One --exclude PATTERN pair per non-blank line of the `exclude` input.
        exclude_args=()
        while IFS= read -r pattern; do
          if [ -n "$pattern" ]; then
            exclude_args+=(--exclude "$pattern")
          fi
        done <<< "$EXCLUDE_PATTERNS"
        safesc audit "$TARGET" \
          --report-dir "$REPORT_DIR" \
          --format "$REPORT_FORMAT" \
          "${exclude_args[@]}"
        code=$?
        # Defer the gate's exit code so the report-publishing steps below still run;
        # a later step re-applies it so the check still fails on a critical finding.
        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"
        # Was a SARIF file actually produced? (only when format is all|sarif)
        if [ -f "$REPORT_DIR/safesc-report.sarif" ]; then
          echo "sarif-produced=true" >> "$GITHUB_OUTPUT"
        else
          echo "sarif-produced=false" >> "$GITHUB_OUTPUT"
        fi
        exit 0

    # Folded-in publishing so consumers need a single `uses:` step, not three (§CI wrapping).
    # continue-on-error: uploading to code scanning needs `security-events: write` AND an
    # environment where code scanning is available (public repo, or private + GitHub
    # Advanced Security). When that's missing the API returns "Resource not accessible by
    # integration" — that must NOT fail the audit, whose verdict is already in the exit code
    # and whose reports are still archived below. The next step surfaces an actionable hint.
    - name: Upload SARIF to code scanning
      id: sarif
      if: >-
        always() && inputs.upload-sarif == 'true'
        && steps.run.outputs.sarif-produced == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.report-dir }}/safesc-report.sarif

    - name: Explain a skipped SARIF upload
      if: >-
        always() && inputs.upload-sarif == 'true'
        && steps.run.outputs.sarif-produced == 'true'
        && steps.sarif.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=SafeSC SARIF upload skipped::Could not upload the SARIF report to GitHub code scanning. This does not affect the audit result (see the exit code) or the archived report artifact. Common causes: (1) the job lacks 'permissions: security-events: write'; (2) the repository is private without GitHub Advanced Security / code scanning enabled. Set upload-sarif: false to silence this."

    - name: Archive report artifacts
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.report-dir }}/

    - name: Re-apply the gate exit code
      if: always()
      shell: bash
      run: exit ${{ steps.run.outputs.exit-code }}
